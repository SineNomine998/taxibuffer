<!doctype html>
<html lang="nl">

<head>
    <meta charset="utf-8">
    <title>Gebruiksvoorwaarden TaxiBuffer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 860px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.6;
            color: #222;
        }

        h1,
        h2 {
            line-height: 1.25;
        }

        .meta {
            color: #666;
            margin-bottom: 32px;
        }
    </style>
</head>

<body>
    {% if terms %}
    <h1>{{ terms.title }}</h1>

    <div class="meta">
        Versie: {{ terms.version }}<br>
        Laatst bijgewerkt: {{ terms.effective_from|date:"d-m-Y" }}
    </div>

    <div>
        {{ terms.body_nl|linebreaks }}
    </div>
    {% else %}
    <h1>Gebruiksvoorwaarden TaxiBuffer</h1>
    <p>Er zijn momenteel geen actieve gebruiksvoorwaarden beschikbaar.</p>
    {% endif %}
</body>

</html>
